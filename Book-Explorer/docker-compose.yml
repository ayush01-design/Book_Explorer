version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres-db
    environment:
      POSTGRES_DB: movie_catalog
      POSTGRES_USER: ayush
      POSTGRES_PASSWORD: Shivmamta@123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    container_name: book-explorer-container
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/movie_catalog
      SPRING_DATASOURCE_USERNAME: ayush
      SPRING_DATASOURCE_PASSWORD: Shivmamta@123

volumes:
  postgres_data: